<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#00e5ff" />
  <title>Snake</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./styles/main.css?v=13" />
</head>
<body>
  <div id="app">

    <header id="hud">
      <div id="score-panel">
        <div class="score-card">
          <span class="score-label" data-i18n="hud.score">Score</span>
          <span class="score-value" id="score-val">0</span>
        </div>
        <div class="score-card">
          <span class="score-label" data-i18n="hud.best">Best</span>
          <span class="score-value" id="best-val">0</span>
        </div>
      </div>
      <div id="run-status" aria-live="polite">
        <span id="speed-level">LV 1</span>
        <span id="combo-status" hidden></span>
      </div>
      <button id="pause-btn" class="hud-icon-btn" aria-label="Pause" hidden>Ⅱ</button>
      <button id="settings-btn" aria-label="Settings">⚙</button>
    </header>

    <main id="board-wrap">
      <div class="canvas-frame">
        <canvas id="game-canvas"></canvas>
        <div id="overlay">
          <!-- Hero Score（只在 Game Over 顯示） -->
          <div id="overlay-hero" hidden>
            <div class="overlay-hero-score" id="overlay-score-hero">0</div>
            <div class="overlay-hs-badge" id="overlay-hs-badge" hidden>🏆 New High Score</div>
          </div>
          <h1 id="overlay-title"></h1>
          <p id="overlay-subtitle"></p>
          <p id="result-comparison" hidden></p>
          <div id="countdown" aria-live="assertive" hidden></div>
          <section id="tutorial-card" hidden>
            <div class="tutorial-gesture">↕ ↔</div>
            <p data-i18n="tutorial.body"></p>
          </section>
          <section id="progress-panel" hidden>
            <div id="daily-summary"></div>
            <canvas id="trend-canvas" width="260" height="64" aria-label="Recent score trend"></canvas>
            <div id="achievement-summary"></div>
          </section>
          <ul id="stats-list" aria-label="Stats"></ul>
          <div id="overlay-actions">
            <button id="overlay-hint" type="button" hidden></button>
            <button id="restart-btn" class="secondary-action" type="button" hidden></button>
            <button id="home-btn" class="secondary-action" type="button" hidden></button>
            <button id="share-btn" class="secondary-action" type="button" hidden data-i18n="share.button">Share Score</button>
          </div>
        </div>
      </div>
    </main>

    <nav id="dpad" aria-label="Direction pad">
      <button class="dpad-btn" data-dir="UP" aria-label="Up">▲</button>
      <button class="dpad-btn" data-dir="LEFT" aria-label="Left">◀</button>
      <div class="dpad-center"></div>
      <button class="dpad-btn" data-dir="RIGHT" aria-label="Right">▶</button>
      <button class="dpad-btn" data-dir="DOWN" aria-label="Down">▼</button>
    </nav>

  </div>

  <div id="settings-panel" hidden>
    <div class="settings-handle"></div>
    <h2 data-i18n="settings.title"></h2>
    <div class="settings-row">
      <span data-i18n="settings.haptics">Vibration</span>
      <label class="toggle-wrap">
        <input type="checkbox" id="haptic-toggle" />
        <span class="toggle-track"></span>
      </label>
    </div>
    <div class="settings-row">
      <span data-i18n="settings.sound">Sound</span>
      <label class="toggle-wrap">
        <input type="checkbox" id="sound-toggle" />
        <span class="toggle-track"></span>
      </label>
    </div>
    <div class="settings-row">
      <span data-i18n="settings.language">Language</span>
      <select id="lang-select"></select>
    </div>
    <div class="settings-row">
      <label for="mode-select" data-i18n="settings.mode">Mode</label>
      <select id="mode-select">
        <option value="classic" data-i18n="mode.classic">Classic</option>
        <option value="boundary" data-i18n="mode.boundary">Boundary</option>
        <option value="obstacle" data-i18n="mode.obstacle">Obstacles</option>
        <option value="daily" data-i18n="mode.daily">Daily Challenge</option>
      </select>
    </div>
    <div class="settings-row">
      <label for="theme-select" data-i18n="settings.theme">Theme</label>
      <select id="theme-select"></select>
    </div>
    <div class="settings-row">
      <label for="difficulty-select" data-i18n="settings.difficulty">Difficulty</label>
      <select id="difficulty-select">
        <option value="easy" data-i18n="difficulty.easy">Easy</option>
        <option value="normal" data-i18n="difficulty.normal">Normal</option>
        <option value="hard" data-i18n="difficulty.hard">Hard</option>
      </select>
    </div>
  </div>
  <div id="settings-backdrop" hidden></div>

  <script type="module" src="./src/main.js?v=13"></script>
</body>
</html>
