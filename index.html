<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#00e5ff" />
  <title>Snake</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div id="app">

    <header id="hud">
      <div id="score-panel">
        <div class="score-card">
          <span class="score-label" data-i18n="hud.score">Score</span>
          <span class="score-value" id="score-val">0</span>
        </div>
        <div class="score-card">
          <span class="score-label">BEST</span>
          <span class="score-value" id="best-val">0</span>
        </div>
      </div>
      <button id="settings-btn" aria-label="Settings">⚙</button>
    </header>

    <main id="board-wrap">
      <div class="canvas-frame">
        <canvas id="game-canvas"></canvas>
        <div id="overlay">
          <!-- Hero Score（只在 Game Over 顯示） -->
          <div id="overlay-hero" hidden>
            <div class="overlay-hero-score" id="overlay-score-hero">0</div>
            <div class="overlay-hs-badge" id="overlay-hs-badge" hidden>🏆 New High Score</div>
          </div>
          <h1 id="overlay-title"></h1>
          <p id="overlay-subtitle"></p>
          <ul id="stats-list" aria-label="Stats"></ul>
          <button id="overlay-hint" type="button" hidden></button>
        </div>
      </div>
    </main>

    <nav id="dpad" aria-label="Direction pad">
      <button class="dpad-btn" data-dir="UP" aria-label="Up">▲</button>
      <button class="dpad-btn" data-dir="LEFT" aria-label="Left">◀</button>
      <div class="dpad-center"></div>
      <button class="dpad-btn" data-dir="RIGHT" aria-label="Right">▶</button>
      <button class="dpad-btn" data-dir="DOWN" aria-label="Down">▼</button>
    </nav>

  </div>

  <div id="settings-panel" hidden>
    <div class="settings-handle"></div>
    <h2 data-i18n="settings.title"></h2>
    <div class="settings-row">
      <span data-i18n="settings.haptics">Vibration</span>
      <label class="toggle-wrap">
        <input type="checkbox" id="haptic-toggle" />
        <span class="toggle-track"></span>
      </label>
    </div>
    <div class="settings-row">
      <span data-i18n="settings.sound">Sound</span>
      <label class="toggle-wrap">
        <input type="checkbox" id="sound-toggle" />
        <span class="toggle-track"></span>
      </label>
    </div>
    <div class="settings-row">
      <span data-i18n="settings.language">Language</span>
      <select id="lang-select"></select>
    </div>
  </div>
  <div id="settings-backdrop" hidden></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
